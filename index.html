<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Doraemon 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(180deg, #8ed8ff, #e9f8ff);
      text-align: center;
      color: #17324d;
    }

    .hero {
      min-height: 100vh;
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(38px, 9vw, 75px);
      color: #0879d1;
      text-shadow: 3px 3px white;
      animation: bounce 1.5s infinite;
      z-index: 2;
    }

    .date {
      margin-top: 12px;
      font-size: 22px;
      font-weight: bold;
      z-index: 2;
    }

    .doraemon {
      margin: 30px 0;
      width: 190px;
      height: 190px;
      background: #159be8;
      border-radius: 50%;
      position: relative;
      border: 5px solid #0875b8;
      box-shadow: 0 12px 25px rgba(0,0,0,.2);
    }

    .face {
      position: absolute;
      width: 165px;
      height: 135px;
      background: white;
      border-radius: 50% 50% 48% 48%;
      left: 8px;
      top: 45px;
    }

    .eye {
      position: absolute;
      width: 35px;
      height: 48px;
      background: white;
      border: 3px solid #222;
      border-radius: 50%;
      top: -25px;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 17px;
      background: #222;
      border-radius: 50%;
      left: 10px;
      top: 15px;
    }

    .eye.left {
      left: 47px;
    }

    .eye.right {
      right: 47px;
    }

    .nose {
      position: absolute;
      width: 25px;
      height: 25px;
      background: #e92828;
      border-radius: 50%;
      left: 68px;
      top: 17px;
      z-index: 2;
    }

    .nose-line {
      position: absolute;
      width: 3px;
      height: 35px;
      background: #222;
      left: 80px;
      top: 40px;
    }

    .mouth {
      position: absolute;
      width: 105px;
      height: 55px;
      border-bottom: 4px solid #222;
      border-radius: 0 0 60px 60px;
      left: 30px;
      top: 48px;
    }

    .bell {
      position: absolute;
      width: 55px;
      height: 38px;
      background: #ffd92f;
      border: 3px solid #d09f00;
      border-radius: 50%;
      bottom: -12px;
      left: 67px;
    }

    .bell::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 8px;
      background: #8b6900;
      border-radius: 50%;
      left: 18px;
      bottom: 4px;
    }

    .message {
      max-width: 650px;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 25px;
      z-index: 2;
    }

    button {
      border: none;
      padding: 16px 30px;
      border-radius: 40px;
      background: #0879d1;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.2);
      z-index: 2;
      transition: .2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    #surprise {
      display: none;
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
      color: #e33;
      z-index: 2;
    }

    .balloon {
      position: absolute;
      width: 55px;
      height: 70px;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite;
      opacity: .9;
    }

    .b1 { left: 5%; top: 15%; background: #ff5757; }
    .b2 { right: 7%; top: 20%; background: #ffd92f; animation-delay: .7s; }
    .b3 { left: 12%; bottom: 12%; background: #9b6cff; animation-delay: 1.2s; }
    .b4 { right: 12%; bottom: 10%; background: #36c96f; animation-delay: 1.8s; }

    .confetti {
      position: fixed;
      width: 9px;
      height: 14px;
      top: -20px;
      animation: fall 3s linear forwards;
      z-index: 10;
    }

    @keyframes bounce {
      50% { transform: translateY(-8px); }
    }

    @keyframes float {
      50% { transform: translateY(-25px); }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <h1>🎉 HAPPY BIRTHDAY DORAEMON! 🎉</h1>

    <div class="date">🎂 3 SEPTEMBER 🎂</div>

    <div class="doraemon">
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nose"></div>
        <div class="nose-line"></div>
        <div class="mouth"></div>
      </div>
      <div class="bell"></div>
    </div>

    <p class="message">
      🔵 Today is a very special day!<br>
      Let's celebrate Doraemon's birthday with lots of fun,
      happiness and surprises! 🎁✨
    </p>

    <button onclick="surprise()">🎁 OPEN THE SURPRISE 🎁</button>

    <div id="surprise">
      🎊🎂 HAPPY BIRTHDAY DORAEMON! 🎂🎊<br><br>
      💙 Thank you for all the amazing adventures! 💙
    </div>

  </section>

  <script>
    function surprise() {
      document.getElementById("surprise").style.display = "block";

      for (let i = 0; i < 100; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background =
          ["#ff4d4d", "#ffd92f", "#36c96f", "#9b6cff", "#0879d1"]
          [Math.floor(Math.random() * 5)];

        piece.style.animationDuration =
          (2 + Math.random() * 2) + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, 4500);
      }
    }
  </script>

</body>
</html>
